[build]
  base = "frontend"
  publish = "build/web"
  command = """
    curl -o flutter.tar.xz https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_3.22.5-stable.tar.xz
    tar -xf flutter.tar.xz
    export PATH="$PATH:$(pwd)/flutter/bin"
    flutter pub get
    flutter build web --release
  """
